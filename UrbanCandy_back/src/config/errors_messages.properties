# --- SEGURANÇA E ACESSO ---
AUTH_REQUIRED=Acesso negado. Token de autenticação não fornecido.
INVALID_TOKEN=Sua sessão expirou ou o token é inválido. Faça login novamente.
FORBIDDEN=Você não tem permissão para realizar esta ação.
INVALID_CREDENTIALS=E-mail ou senha incorretos.

# --- VALIDAÇÕES DE USUÁRIO ---
INVALID_EMAIL=O e-mail deve conter @ e terminar com .com.
INVALID_CPF=O CPF deve conter exatamente 11 dígitos.
INVALID_PASSWORD=A senha deve ter no mínimo 8 caracteres, incluindo letras e números.
EMAIL_ALREADY_EXISTS=Já existe um registro com o e-mail {}.
CPF_ALREADY_EXISTS=Já existe um registro com o CPF {}.
ORDER_STATUS_CONFLICT=O status do pedido foi alterado por outra operação. Atualize a tela e tente novamente.

# --- VALIDAÇÕES GERAIS ---
DUPLICATE_ENTRY=Já existe um registro com o valor {}.
INVALID_FORMAT=O formato do campo {} está incorreto.
FILE_TOO_LARGE=O arquivo enviado é muito grande.
UPLOAD_ERROR=Erro ao processar o upload da imagem.
PAYMENT_GATEWAY_NOT_CONFIGURED=O pagamento online ainda não está configurado no servidor. Configure a credencial do Mercado Pago no backend.
PAYMENT_CHECKOUT_FAILED=O Mercado Pago não conseguiu iniciar o checkout. Verifique as credenciais de teste e tente novamente.
PAYMENT_PRODUCTION_CREDENTIAL_REQUIRED=O backend está em produção, mas foi configurado com uma credencial de teste. Configure a credencial de produção do Mercado Pago.

CATEGORY_NOT_FOUND=A categoria {} não existe.
FAILED_TO_VALIDATE_CEP=Não foi possível validar o CEP no momento. Tente novamente mais tarde.
