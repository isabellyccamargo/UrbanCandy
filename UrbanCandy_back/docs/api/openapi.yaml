openapi: 3.0.3
info:
  title: UrbanCandy API
  version: 1.0.0
  description: >-
    Especificação resumida dos principais fluxos da API. Arquivo:
    UrbanCandy_back/docs/api/openapi.yaml. Swagger UI disponível em
    /api-docs no host e na porta do backend.
servers:
  - url: /api
    description: Prefixo das rotas no backend
tags:
  - name: Saúde
  - name: Autenticação
  - name: Catálogo
  - name: Pedidos
  - name: Pagamentos
  - name: Administração
paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está ativa
      security: []
      responses:
        '200':
          description: API ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  /login:
    post:
      tags: [Autenticação]
      summary: Autentica o usuário e retorna um token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /usuario/salvar:
    post:
      tags: [Autenticação]
      summary: Cadastra uma nova conta
      description: Endpoint público. O envio de imagem é opcional.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, password, name, cpf, cep, city, neighborhood, road, number]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                name: { type: string }
                cpf: { type: string }
                telephone: { type: string }
                cep: { type: string }
                city: { type: string }
                neighborhood: { type: string }
                road: { type: string }
                number: { type: integer }
                complement: { type: string }
                image: { type: string, format: binary }
      responses:
        '201':
          description: Conta cadastrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /email-verification/confirm:
    post:
      tags: [Autenticação]
      summary: Confirma o e-mail usando o código recebido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        '200': { description: Confirmação processada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Serviço de e-mail temporariamente indisponível }

  /produto/listar:
    get:
      tags: [Catálogo]
      summary: Lista produtos
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, default: 6 }
        - name: id_category
          in: query
          description: Filtra os produtos por ID de categoria
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Lista paginada de produtos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedProducts' }

  /produto/listarPorId/{id_product}:
    get:
      tags: [Catálogo]
      summary: Busca produto por ID
      security: []
      parameters:
        - name: id_product
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categoria/listar:
    get:
      tags: [Catálogo]
      summary: Lista categorias
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, default: 6 }
      responses:
        '200':
          description: Lista paginada de categorias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedCategories' }

  /oferta/listar:
    get:
      tags: [Catálogo]
      summary: Lista ofertas ativas
      security: []
      responses:
        '200':
          description: Ofertas ativas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Offer' }

  /pedido/checkout:
    post:
      tags: [Pedidos]
      summary: Registra um pedido pago em dinheiro
      description: Requer JWT. Para Pix ou cartão, utilize o checkout do Mercado Pago.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id_orders: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pedido/usuario/{id_people}:
    get:
      tags: [Pedidos]
      summary: Consulta pedidos de uma pessoa
      description: Requer JWT. A rota atual não valida se o identificador pertence ao usuário autenticado.
      security:
        - bearerAuth: []
      parameters:
        - name: id_people
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Lista paginada de pedidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedOrders' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pedido/{id_order}/cancel:
    patch:
      tags: [Pedidos]
      summary: Cancela um pedido próprio ainda recebido
      security:
        - bearerAuth: []
      parameters:
        - name: id_order
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pagamento/checkout:
    post:
      tags: [Pagamentos]
      summary: Inicia checkout online pelo Mercado Pago
      description: Requer JWT. O pedido é criado após confirmação do pagamento.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_payment, id_type_delivery, cart]
              properties:
                id_payment: { type: integer }
                id_type_delivery: { type: integer }
                payment_method:
                  type: string
                  enum: [pix, card, both]
                cart: { $ref: '#/components/schemas/Cart' }
      responses:
        '201':
          description: Checkout criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptId: { type: string, format: uuid }
                  checkoutUrl: { type: string, format: uri }
                  total: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Falha ao iniciar checkout no provedor }

  /pagamento/checkout/{id}:
    get:
      tags: [Pagamentos]
      summary: Consulta o estado de uma tentativa de pagamento
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado da tentativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  id_order: { type: integer, nullable: true }
                  total: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pagamento/webhook:
    post:
      tags: [Pagamentos]
      summary: Recebe notificação do Mercado Pago
      description: O backend valida a assinatura e consulta o pagamento no provedor.
      security: []
      parameters:
        - name: x-signature
          in: header
          required: true
          schema: { type: string }
        - name: x-request-id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Notificação processada }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/usuarios:
    get:
      tags: [Administração]
      summary: Lista usuários com dados pessoais e papéis
      description: Requer autenticação e papel manager, gerente, admin ou nome numérico 3.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 6 }
        - name: role
          in: query
          description: Filtra pelo perfil atribuído ao usuário
          schema:
            type: string
            enum: [all, customer, employee, manager]
            default: all
      responses:
        '200':
          description: Página de usuários sem dados de senha
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalItems: { type: integer }
                  totalPages: { type: integer }
                  currentPage: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id_user: { type: integer }
                        email: { type: string, format: email }
                        people:
                          type: object
                          nullable: true
                          properties:
                            id_people: { type: integer }
                            name: { type: string }
                            cpf: { type: string }
                            telephone: { type: string, nullable: true }
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              id_role: { type: integer }
                              name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/usuarios/{id_user}/roles:
    put:
      tags: [Administração]
      summary: Substitui papéis de um usuário
      security:
        - bearerAuth: []
      parameters:
        - name: id_user
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_roles]
              properties:
                id_roles:
                  type: array
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        '200': { description: Papéis substituídos }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/pessoas/{id_people}:
    put:
      tags: [Administração]
      summary: Atualiza nome e telefone de uma pessoa
      description: Outros campos, incluindo CPF e endereço, não são aceitos.
      security:
        - bearerAuth: []
      parameters:
        - name: id_people
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                telephone: { type: string, nullable: true }
      responses:
        '200': { description: Dados pessoais atualizados }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/papeis:
    get:
      tags: [Administração]
      summary: Lista papéis e permissões associadas
      security:
        - bearerAuth: []
      responses:
        '200': { description: Lista de papéis com permissões }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/permissoes:
    get:
      tags: [Administração]
      summary: Lista todas as permissões
      security:
        - bearerAuth: []
      responses:
        '200': { description: Lista de permissões }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/papeis/{id_role}/permissoes:
    put:
      tags: [Administração]
      summary: Substitui permissões de um papel
      security:
        - bearerAuth: []
      parameters:
        - name: id_role
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_permissions]
              properties:
                id_permissions:
                  type: array
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        '200': { description: Permissões substituídas }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Forbidden:
      description: Acesso não permitido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Conflict:
      description: Conflito com dado existente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    Product:
      type: object
      properties:
        id_product: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number, nullable: true }
        image: { type: string }
        id_category: { type: integer }
        featured: { type: boolean }
    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        totalItems: { type: integer }
        totalPages: { type: integer }
        currentPage: { type: integer }
    Category:
      type: object
      properties:
        id_category: { type: integer }
        name_category: { type: string }
    PaginatedCategories:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        totalItems: { type: integer }
        totalPages: { type: integer }
        currentPage: { type: integer }
    Offer:
      type: object
      properties:
        id_offer: { type: integer }
        name_offer: { type: string }
        description: { type: string, nullable: true }
        discount: { type: number }
        price_offer: { type: number }
    CheckoutRequest:
      type: object
      required: [id_payment, id_type_delivery, cart]
      properties:
        id_payment: { type: integer }
        id_type_delivery: { type: integer }
        cart: { $ref: '#/components/schemas/Cart' }
    Cart:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id_product, quantity]
            properties:
              id_product: { type: integer }
              quantity: { type: integer }
        offers:
          type: array
          description: Active offers are priced by the server using the current offer price.
          items:
            type: object
            required: [id_offer, quantity]
            properties:
              id_offer: { type: integer }
              quantity: { type: integer, minimum: 1, maximum: 99 }
    PaginatedOrders:
      type: object
      properties:
        totalItems: { type: integer }
        totalPages: { type: integer }
        currentPage: { type: integer }
        data:
          type: array
          items: { type: object, additionalProperties: true }
