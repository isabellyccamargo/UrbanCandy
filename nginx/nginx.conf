events {}

http {
    # 1. SERVIDOR HTTP (Porta 80)
    server {
        listen 80;
        server_name urbancandy.local localhost;
        return 301 https://$host$request_uri;
    }

    # 2. SERVIDOR HTTPS (Porta 443)
    server {
        listen 443 ssl;
        server_name urbancandy.local localhost;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Frontend
        location / {
            proxy_pass http://urbancandy-frontend:5173; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend com limpeza e imposição de CORS
        location /api/ {
            proxy_pass http://urbancandy-backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Uploads
        location /uploads/ {
            proxy_pass http://urbancandy-backend:3000; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}