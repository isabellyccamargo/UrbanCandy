name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Test backend
        run: npm run test:back
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: urbancandy_test
          DB_USER: root
          DB_PASSWORD: ci-only-not-a-real-secret
          JWT_SECRET: ci-only-not-a-real-secret

      - name: Test frontend
        run: npm run test:front

      - name: Test email service
        run: npm run test:email

      - name: Build backend, frontend, and email service
        run: npm run build:check

      - name: Validate Docker Compose configuration
        run: docker compose config -q
        env:
          DB_PASSWORD: ci-only-not-a-real-secret
          JWT_SECRET: ci-only-not-a-real-secret
          EMAIL_API_KEY: ci-only-not-a-real-secret
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-real-secret

      - name: Build application images
        run: docker compose build urbancandy-backend urbancandy-email urbancandy-frontend
        env:
          DB_PASSWORD: ci-only-not-a-real-secret
          JWT_SECRET: ci-only-not-a-real-secret
          EMAIL_API_KEY: ci-only-not-a-real-secret
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-real-secret

  deploy:
    name: Deploy (temporary CI environment)
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-only-not-a-real-secret
      JWT_SECRET: ci-only-not-a-real-secret
      EMAIL_API_KEY: ci-only-not-a-real-secret
      GRAFANA_ADMIN_PASSWORD: ci-only-not-a-real-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy application stack to the runner
        run: >-
          docker compose up --build --detach --wait --wait-timeout 300
          urbancandy-nginx urbancandy-email

      - name: Check API health through the deployed stack
        run: curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3030/api/health

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove temporary deployment
        if: always()
        run: docker compose down --remove-orphans
