services:
  # BANCO DE DADOS
  urbancandy-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - urbancandy_db_data:/var/lib/mysql
    networks:
      - urbancandy-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  #  BACKEND
  urbancandy-backend:
    restart: always
    build: ./UrbanCandy_back
    image: urbancandy-backend:latest
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3030
      DB_HOST: urbancandy-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./UrbanCandy_back/uploads:/app/uploads
    networks:
      - urbancandy-network
    depends_on:
      urbancandy-db:
        condition: service_healthy

  # FRONTEND
  urbancandy-frontend:
    build:
      context: ./UrbanCandy_front
      dockerfile: Dockerfile
    image: urbancandy-frontend:latest
    restart: always
    networks:
      - urbancandy-network

  # Nginx
  urbancandy-nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - urbancandy-network
    depends_on:
      - urbancandy-frontend
      - urbancandy-backend

volumes:
  urbancandy_db_data:

networks:
  urbancandy-network:
    driver: bridge
