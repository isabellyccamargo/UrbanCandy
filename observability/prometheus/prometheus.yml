global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: urbancandy-backend
    metrics_path: /metrics
    static_configs:
      - targets: [urbancandy-backend:9464]

  - job_name: urbancandy-api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://urbancandy-backend:3030/api/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: urbancandy-blackbox-exporter:9115
